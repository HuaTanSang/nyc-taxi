[project]
name = "nyc-taxi"
version = "0.1.0"
description = "NYC TLC analytics on Azure and Databricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow[postgres]==3.2.2",
    "astronomer-cosmos==1.15.1",
    "apache-airflow-providers-databricks==7.23.0",
    "azure-identity==1.27.0",
    "azure-storage-file-datalake==12.26.1",
    "pandas==3.0.5",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "dbt-core==1.11.12",
    "dbt-databricks==1.13.0",
    "databricks-sql-connector==4.4.0",
    "databricks-sdk==0.117.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.1",
    "ruff==0.16.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
