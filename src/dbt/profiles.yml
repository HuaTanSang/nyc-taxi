nyc_taxi:
  target: dev

  outputs:
    dev:
      type: clickhouse

      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: 8123

      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"

      schema: default

      secure: false
      verify: false

      threads: 4
      connect_timeout: 10
      send_receive_timeout: 600