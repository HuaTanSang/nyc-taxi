nyc_taxi:
  target: databricks
  outputs:
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '').replace('https://', '').rstrip('/') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', '') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', '') }}"
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID', '') }}"
      client_secret: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_CLIENT_SECRET', '') }}"
      threads: 1
