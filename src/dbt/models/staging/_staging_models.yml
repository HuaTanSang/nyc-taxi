version: 2

models:
  - name: stg_yellow_trips
    description: >-
      Cleaned, typed Yellow Taxi trip records at one row per source trip.
      No filtering, deduplication, joins, or business aggregations are applied.
    columns:
      - name: vendor_id
        description: Code identifying the technology provider that submitted the trip record.
      - name: pickup_datetime
        description: Date and time when the meter was engaged.
      - name: dropoff_datetime
        description: Date and time when the meter was disengaged.
      - name: passenger_count
        description: Driver-entered number of passengers in the vehicle.
      - name: trip_distance
        description: Trip distance reported by the taximeter in miles.
      - name: rate_code_id
        description: Final rate code in effect at the end of the trip.
      - name: store_and_fwd_flag
        description: Indicates whether the trip record was stored before being sent to the vendor.
      - name: pickup_location_id
        description: TLC Taxi Zone identifier where the meter was engaged.
      - name: dropoff_location_id
        description: TLC Taxi Zone identifier where the meter was disengaged.
      - name: payment_type_id
        description: Code describing how the passenger paid for the trip.
      - name: fare_amount
        description: Time-and-distance fare calculated by the meter.
      - name: extra
        description: Miscellaneous extras and surcharges assessed on the trip.
      - name: mta_tax
        description: MTA tax assessed based on the metered rate in use.
      - name: tip_amount
        description: Automatically populated credit-card tip amount.
      - name: tolls_amount
        description: Total tolls paid during the trip.
      - name: improvement_surcharge
        description: Improvement surcharge assessed at flag drop.
      - name: total_amount
        description: Total amount charged to passengers excluding cash tips.
      - name: congestion_surcharge
        description: NYS congestion surcharge collected for the trip.
      - name: airport_fee
        description: Airport pickup fee assessed where applicable.
      - name: cbd_congestion_fee
        description: Congestion Relief Zone fee assessed where applicable.
      - name: source_path
        description: Full object path from which the raw record was read.
        tests:
          - not_null
      - name: source_file
        description: Source object filename.
        tests:
          - not_null
      - name: source_year
        description: Year selected by the ingestion and raw-model run.
        tests:
          - not_null
      - name: source_month
        description: Month selected by the ingestion and raw-model run.
        tests:
          - not_null

  - name: stg_green_trips
    description: >-
      Cleaned, typed Green Taxi trip records at one row per source trip.
      No filtering, deduplication, joins, or business aggregations are applied.
    columns:
      - name: vendor_id
        description: Code identifying the technology provider that submitted the trip record.
      - name: pickup_datetime
        description: Date and time when the meter was engaged.
      - name: dropoff_datetime
        description: Date and time when the meter was disengaged.
      - name: store_and_fwd_flag
        description: Indicates whether the trip record was stored before being sent to the vendor.
      - name: rate_code_id
        description: Final rate code in effect at the end of the trip.
      - name: pickup_location_id
        description: TLC Taxi Zone identifier where the meter was engaged.
      - name: dropoff_location_id
        description: TLC Taxi Zone identifier where the meter was disengaged.
      - name: passenger_count
        description: Driver-entered number of passengers in the vehicle.
      - name: trip_distance
        description: Trip distance reported by the taximeter in miles.
      - name: fare_amount
        description: Time-and-distance fare calculated by the meter.
      - name: extra
        description: Miscellaneous extras and surcharges assessed on the trip.
      - name: mta_tax
        description: MTA tax assessed based on the metered rate in use.
      - name: tip_amount
        description: Automatically populated credit-card tip amount.
      - name: tolls_amount
        description: Total tolls paid during the trip.
      - name: ehail_fee
        description: Electronic-hail fee reported by the source when applicable.
      - name: improvement_surcharge
        description: Improvement surcharge assessed at flag drop.
      - name: total_amount
