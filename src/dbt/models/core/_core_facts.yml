version: 2

models:
  - name: fct_yellow_taxi
    description: >-
      Atomic Yellow Taxi fact. One row represents one source trip record from
      one monthly TLC object.
    columns:
      - name: trip_sk
        description: Deterministic surrogate key for the source trip record.
        data_tests: [not_null, unique]
      - name: vendor_id
        description: TLC technology-provider code.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_id
              config:
                severity: warn
      - name: rate_code_id
        description: Final metered-rate code.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_rate_code')
                field: rate_code_id
              config:
                severity: warn
      - name: payment_type_id
        description: Passenger payment-type code.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_id
              config:
                severity: warn
      - name: pickup_datetime
        description: Timestamp when the meter was engaged.
      - name: dropoff_datetime
        description: Timestamp when the meter was disengaged.
      - name: pickup_date_id
        description: Pickup date key formatted as YYYYMMDD.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
              config:
                severity: warn
      - name: dropoff_date_id
        description: Drop-off date key formatted as YYYYMMDD.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
              config:
                severity: warn
      - name: pickup_location_id
        description: Pickup TLC Taxi Zone identifier.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_taxi_zone')
                field: location_id
              config:
                severity: warn
      - name: dropoff_location_id
        description: Drop-off TLC Taxi Zone identifier.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_taxi_zone')
                field: location_id
              config:
                severity: warn
      - name: trip_distance_miles
        description: Taximeter-reported distance in miles.
      - name: passenger_count
        description: Driver-entered passenger count.
      - name: fare_amount
        description: Time-and-distance fare calculated by the meter.
      - name: extra
        description: Miscellaneous extras and surcharges.
      - name: mta_tax
        description: MTA tax assessed for the trip.
      - name: tip_amount
        description: Reported credit-card tip; cash tips are not included.
      - name: tolls_amount
        description: Total tolls paid during the trip.
      - name: improvement_surcharge
        description: Improvement surcharge assessed at flag drop.
      - name: congestion_surcharge
        description: NYS congestion surcharge collected for the trip.
      - name: cbd_congestion_fee
        description: Congestion Relief Zone fee assessed for the trip.
      - name: airport_fee
        description: Airport pickup fee where applicable.
      - name: total_amount
        description: Total passenger charge excluding cash tips.
      - name: trip_duration_seconds
        description: Drop-off minus pickup time in seconds.
      - name: source_file_id
        description: Full source object path used as a stable lineage identifier.
        data_tests: [not_null]
      - name: row_number
        description: Row ordinal within source_file_id ordered by a full-record fingerprint.
        data_tests: [not_null]
      - name: source_year
        description: Year of the monthly source object and physical partition.
        data_tests: [not_null]
      - name: source_month
        description: Month of the monthly source object and physical partition.
        data_tests: [not_null]

