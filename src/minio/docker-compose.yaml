services:  
  minio:
    build:
      context: .
      dockerfile: Dockerfile
    image: nyc-taxi-minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin} 
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}    
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - platform_net
        


volumes:
  minio_data:

networks:
  platform_net:
    external: true
    name: platform_net