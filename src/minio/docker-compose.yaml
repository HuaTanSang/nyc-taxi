services:  
  minio:
    build:
      context: .
      dockerfile: dockerfile
    image: nyc-taxi-minio:${IMAGE_TAG:-local}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default
      - platform_net

volumes:
  minio_data:

networks:
  default:
  platform_net:
    external: true
    name: platform_net
