services:
  clickhouse:
    build:
      context: .
      dockerfile: dockerfile
    image: nyc-taxi-clickhouse:${IMAGE_TAG:-local}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9002}:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config.d/10-memory.xml:/etc/clickhouse-server/config.d/10-memory.xml:ro
      - ./users.d/10-memory.xml:/etc/clickhouse-server/users.d/10-memory.xml:ro
    mem_limit: 5g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - platform_net

volumes:
  clickhouse_data:

networks:
  platform_net:
    external: true
    name: platform_net
