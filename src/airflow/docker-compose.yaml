x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__DAG_RUN_CONF_OVERRIDES_PARAMS: "true"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@postgres/${AIRFLOW_POSTGRES_DB}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET}
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__CORE__PARALLELISM: "2"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
  S3_CONNECTION_ID: ${S3_CONNECTION_ID:-minio_s3}
  RAW_BUCKET_NAME: ${RAW_BUCKET_NAME:-nyc-taxi-raw}
  DBT_ROOT_PATH: /opt/airflow/dags/dbt
  DBT_PROFILES_DIR: /opt/airflow/dags/dbt
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-permissions:
    build:
      context: .
      dockerfile: dockerfile
    image: nyc-taxi-airflow:${IMAGE_TAG:-local}
    user: "0:0"
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID}
    volumes:
      - airflow_logs:/opt/airflow/logs
    entrypoint: ["/bin/bash", "-c"]
    command: ["chown -R \"$${AIRFLOW_UID}:0\" /opt/airflow/logs"]
    restart: "no"

  airflow-init:
    build:
      context: .
      dockerfile: dockerfile
    image: nyc-taxi-airflow:${IMAGE_TAG:-local}
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "${AIRFLOW_UID}:0"
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ../dbt:/opt/airflow/dags/dbt
    command: version
    depends_on:
      postgres:
        condition: service_healthy
      airflow-permissions:
        condition: service_completed_successfully
    restart: "no"

  airflow-apiserver:
    build:
      context: .
      dockerfile: dockerfile
    image: nyc-taxi-airflow:${IMAGE_TAG:-local}
    environment: *airflow-env
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-volumes
    command: api-server
    ports:
      - "${AIRFLOW_WEB_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - platform_net

  airflow-scheduler:
    image: nyc-taxi-airflow:${IMAGE_TAG:-local}
    environment: *airflow-env
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-volumes
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - platform_net

  airflow-dag-processor:
    image: nyc-taxi-airflow:${IMAGE_TAG:-local}
    environment: *airflow-env
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-volumes
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - platform_net

  airflow-triggerer:
    image: nyc-taxi-airflow:${IMAGE_TAG:-local}
    environment: *airflow-env
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-volumes
    command: triggerer
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - platform_net

volumes:
  airflow_postgres_data:
  airflow_logs:

networks:
  default:
  platform_net:
    external: true
    name: platform_net
