x-superset-environment: &superset-environment
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
  SUPERSET_POSTGRES_DB: ${SUPERSET_POSTGRES_DB}
  SUPERSET_POSTGRES_USER: ${SUPERSET_POSTGRES_USER}
  SUPERSET_POSTGRES_PASSWORD: ${SUPERSET_POSTGRES_PASSWORD}
  SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
  SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME}
  SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME}
  SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}

x-superset-common: &superset-common
  build:
    context: .
    dockerfile: dockerfile
    args:
      SUPERSET_VERSION: ${SUPERSET_VERSION:-6.0.0}
  image: nyc-taxi-superset:${IMAGE_TAG:-local}
  environment:
    <<: *superset-environment
services:
  superset-db:
    image: postgres:${SUPERSET_POSTGRES_VERSION:-16.9-alpine}
    environment:
      POSTGRES_DB: ${SUPERSET_POSTGRES_DB}
      POSTGRES_USER: ${SUPERSET_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SUPERSET_POSTGRES_PASSWORD}
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  superset-init:
    <<: *superset-common
    environment:
      <<: *superset-environment
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    depends_on:
      superset-db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e

        superset db upgrade

        existing_users=$$(superset fab list-users)
        if printf '%s\n' "$${existing_users}" | grep -Fq "$${SUPERSET_ADMIN_USERNAME}"; then
          echo "Superset admin already exists: $${SUPERSET_ADMIN_USERNAME}"
        else
          superset fab create-admin \
            --username "$${SUPERSET_ADMIN_USERNAME}" \
            --firstname "$${SUPERSET_ADMIN_FIRSTNAME}" \
            --lastname "$${SUPERSET_ADMIN_LASTNAME}" \
            --email "$${SUPERSET_ADMIN_EMAIL}" \
            --password "$${SUPERSET_ADMIN_PASSWORD}"
        fi

        superset init

        python /app/bootstrap/bootstrap_clickhouse.py
    restart: "no"

  superset:
    <<: *superset-common
    depends_on:
      superset-db:
        condition: service_healthy
    networks:
      - default
      - platform_net
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    command:
      - /bin/sh
      - -c
      - |
        exec gunicorn \
          --bind "0.0.0.0:8088" \
          --workers 2 \
          --worker-class gthread \
          --threads 4 \
          --timeout 120 \
          --access-logfile - \
          --error-logfile - \
          "superset.app:create_app()"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/health')\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  superset_postgres_data:

networks:
  default:
  platform_net:
    external: true
    name: platform_net
